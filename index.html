<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lunch Roulette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">
<style>
  /* Layout: full-bleed map with a control panel (left column on desktop, bottom sheet on phones) */
  :root {
    --bg: #eef1ee;
    --panel: #ffffff;
    --ink: #17262b;
    --muted: #5b6b70;
    --line: #d5dcd8;
    --hi: #ffd84a;        /* highlighter */
    --hi-ink: #17262b;
    --hi-wash: rgba(255, 216, 74, 0.32);
    --pin: #e4452f;
    --dot: #2f6f73;
    --tile-filter: none;
    --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101719;
      --panel: #19242a;
      --ink: #eaf0ee;
      --muted: #9fb0b1;
      --line: #2c3b41;
      --hi-wash: rgba(255, 216, 74, 0.22);
      --pin: #ff6f58;
      --dot: #6fc3c4;
      --tile-filter: invert(0.92) hue-rotate(180deg) saturate(0.7) brightness(0.95) contrast(0.9);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 var(--font-body);
    display: flex;
    flex-direction: column;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  #map { flex: 1 1 auto; min-height: 42dvh; background: var(--bg); }
  .leaflet-tile-pane { filter: var(--tile-filter); }

  .panel {
    flex: 0 0 auto;
    max-height: 56dvh;
    overflow-y: auto;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding-block: 16px calc(16px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  @media (min-width: 860px) {
    body { flex-direction: row-reverse; }
    #map { min-height: 0; }
    .panel {
      flex: 0 0 380px;
      max-height: none;
      border-top: 0;
      border-right: 1px solid var(--line);
      padding-block: 24px;
    }
  }

  h1 {
    font: 700 30px/1 var(--font-display);
    letter-spacing: -0.02em;
    margin: 0 0 6px;
    text-wrap: balance;
  }
  h1 mark { background: linear-gradient(transparent 52%, var(--hi) 52% 92%, transparent 92%); color: inherit; padding: 0 2px; }
  .lede { margin: 0; color: var(--muted); max-width: 34ch; }

  .step { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .step h2 {
    margin: 0;
    font: 700 13px/1 var(--font-body);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .step h2 .n {
    display: inline-grid; place-items: center;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--ink); color: var(--panel);
    font-size: 12px; letter-spacing: 0;
  }

  .row { display: flex; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .row > * { min-width: 0; }

  input[type="search"] {
    flex: 1 1 160px;
    padding: 10px 12px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
  }
  input[type="search"]::placeholder { color: var(--muted); }

  .btn {
    border: 1.5px solid var(--ink);
    background: transparent;
    border-radius: 8px;
    padding: 9px 12px;
    cursor: pointer;
    font-weight: 500;
  }
  .btn:hover { background: var(--bg); }
  .btn[aria-pressed="true"] { background: var(--hi); border-color: var(--hi); color: var(--hi-ink); font-weight: 700; }
  .btn.quiet { border-color: var(--line); color: var(--muted); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .modes .btn { padding-inline: 6px; }

  .radius { display: flex; align-items: center; gap: 12px; }
  .radius input { flex: 1; accent-color: var(--ink); min-width: 0; }
  .radius output { min-width: 9ch; text-align: right; font-variant-numeric: tabular-nums; }

  .status { margin: 0; color: var(--muted); min-height: 1.45em; }
  .status.warn { color: var(--pin); }

  .opts { display: flex; gap: 16px; flex-wrap: wrap; }
  .opts label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .opts input { accent-color: var(--ink); width: 16px; height: 16px; }

  .pick {
    width: 100%;
    border: 0;
    border-radius: 10px;
    padding: 15px 16px;
    background: var(--hi);
    color: var(--hi-ink);
    font: 700 18px/1 var(--font-display);
    cursor: pointer;
    box-shadow: 0 3px 0 var(--ink);
    transition: transform 80ms, box-shadow 80ms;
  }
  .pick:hover { transform: translateY(1px); box-shadow: 0 2px 0 var(--ink); }
  .pick:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
  .pick:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: 0 3px 0 var(--ink); }

  .result {
    border: 1.5px solid var(--ink);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .result[hidden] { display: none; }
  .result .name { font: 700 24px/1.1 var(--font-display); letter-spacing: -0.01em; margin: 0; overflow-wrap: anywhere; }
  .result .meta { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
  .result .tag { align-self: flex-start; background: var(--hi-wash); border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 500; }
  .result .links { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 4px; }
  .result a { color: var(--ink); font-weight: 700; text-underline-offset: 3px; }
  .result.spinning .name { opacity: 0.55; }
  .left { margin: 0; color: var(--muted); font-size: 13px; }

  .leaflet-container { font-family: var(--font-body); }
  .leaflet-tooltip { font-family: var(--font-body); }
  .leaflet-top.leaflet-left { top: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .pick { transition: none; }
  }
</style>
</head>
<body>

<div id="map" role="application" aria-label="Map. Highlight the area you want to pick a restaurant from."></div>

<aside class="panel">
  <header>
    <h1>Lunch <mark>Roulette</mark></h1>
    <p class="lede">Highlight the area you're willing to go to. We'll pick the restaurant so nobody has to.</p>
  </header>

  <section class="step" aria-labelledby="s1">
    <h2 id="s1"><span class="n">1</span>Find your area</h2>
    <form class="row" id="search-form">
      <input id="q" type="search" placeholder="Address, neighborhood or city" autocomplete="off" aria-label="Search for a place">
      <button class="btn" type="submit">Go</button>
      <button class="btn quiet" type="button" id="locate">Use my location</button>
    </form>
  </section>

  <section class="step" aria-labelledby="s2">
    <h2 id="s2"><span class="n">2</span>Highlight it</h2>
    <div class="modes" role="group" aria-label="Highlight style">
      <button class="btn" type="button" data-mode="radius" aria-pressed="true">Radius</button>
      <button class="btn" type="button" data-mode="rectangle" aria-pressed="false">Box</button>
      <button class="btn" type="button" data-mode="polygon" aria-pressed="false">Freeform</button>
    </div>
    <div class="radius" id="radius-row">
      <label for="radius">Walk</label>
      <input id="radius" type="range" min="0.1" max="3" step="0.1" value="0.5">
      <output id="radius-out" for="radius">0.5 mi</output>
    </div>
    <p class="status" id="status" aria-live="polite">Tap the map to drop the center of your circle.</p>
    <div class="row"><button class="btn quiet" type="button" id="clear">Clear area</button></div>
  </section>

  <section class="step" aria-labelledby="s3">
    <h2 id="s3"><span class="n">3</span>Pick</h2>
    <div class="opts">
      <label><input type="checkbox" id="t-restaurant" checked> Restaurants</label>
      <label><input type="checkbox" id="t-fast_food"> Fast food</label>
      <label><input type="checkbox" id="t-cafe"> Cafés</label>
    </div>
    <button class="pick" id="pick" type="button" disabled>Pick a restaurant</button>
    <p class="left" id="left"></p>
    <div class="result" id="result" hidden aria-live="polite">
      <span class="tag" id="r-cuisine"></span>
      <h3 class="name" id="r-name"></h3>
      <p class="meta" id="r-addr"></p>
      <p class="meta" id="r-hours"></p>
      <div class="links" id="r-links"></div>
    </div>
  </section>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script>
(function () {
  "use strict";

  var OVERPASS = [
    "https://overpass-api.de/api/interpreter",
    "https://overpass.kumi.systems/api/interpreter"
  ];
  var MAX_SPAN_KM = 12;
  var M_PER_MILE = 1609.344;
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var $ = function (id) { return document.getElementById(id); };
  var statusEl = $("status"), pickBtn = $("pick"), leftEl = $("left");

  // ---------- Map ----------
  var map = L.map("map", { zoomControl: true }).setView([40.7128, -74.006], 13);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  var shapeStyle = { color: "#17262b", weight: 2.5, fillColor: "#ffd84a", fillOpacity: 0.34, dashArray: null };
  var dotsLayer = L.layerGroup().addTo(map);
  var pickLayer = L.layerGroup().addTo(map);

  // ---------- State ----------
  var mode = "radius";
  var handler = null;
  var area = null;          // { layer, test(lat, lon) -> bool }
  var center = null;
  var places = [];          // places in the current area
  var cache = {};           // bbox+types -> raw places
  var seen = {};            // ids already picked in this area
  var busy = false;

  function setStatus(msg, warn) {
    statusEl.textContent = msg;
    statusEl.className = warn ? "status warn" : "status";
  }

  // ---------- Geometry ----------
  function pointInPolygon(lat, lon, ring) {
    var inside = false;
    for (var i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      var yi = ring[i].lat, xi = ring[i].lng, yj = ring[j].lat, xj = ring[j].lng;
      var hit = ((yi > lat) !== (yj > lat)) && (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi);
      if (hit) inside = !inside;
    }
    return inside;
  }

  function spanKm(b) {
    return Math.max(
      map.distance(b.getSouthWest(), b.getNorthWest()),
      map.distance(b.getSouthWest(), b.getSouthEast())
    ) / 1000;
  }

  // ---------- Area handling ----------
  function clearResults() {
    dotsLayer.clearLayers();
    pickLayer.clearLayers();
    places = [];
    seen = {};
    $("result").hidden = true;
    leftEl.textContent = "";
  }

  function clearArea() {
    if (handler) { handler.disable(); handler = null; }
    if (area) { map.removeLayer(area.layer); area = null; }
    center = null;
    clearResults();
    pickBtn.disabled = true;
    promptForMode();
  }

  function promptForMode() {
    if (mode === "radius") setStatus("Tap the map to drop the center of your circle.");
    else if (mode === "rectangle") setStatus("Press and drag on the map to draw a box.");
    else setStatus("Tap points around the area, then tap the first point to close it.");
  }

  function setArea(layer, test) {
    if (area) map.removeLayer(area.layer);
    area = { layer: layer, test: test };
    layer.addTo(map);
    clearResults();
    refreshPlaces();
  }

  function radiusMeters() { return parseFloat($("radius").value) * M_PER_MILE; }

  function drawRadius() {
    if (!center) return;
    var r = radiusMeters();
    var layer = L.circle(center, Object.assign({ radius: r }, shapeStyle));
    var c = center;
    setArea(layer, function (lat, lon) { return map.distance(c, L.latLng(lat, lon)) <= r; });
  }

  function formatMiles(v) { return parseFloat(v).toFixed(1) + " mi"; }

  $("radius").addEventListener("input", function () {
    $("radius-out").textContent = formatMiles(this.value);
    if (center && mode === "radius") {
      if (area) area.layer.setRadius(radiusMeters());
    }
  });
  $("radius").addEventListener("change", function () {
    if (center && mode === "radius") drawRadius();
  });

  map.on("click", function (e) {
    if (mode !== "radius") return;
    center = e.latlng;
    drawRadius();
  });

  function startDraw(kind) {
    if (handler) { handler.disable(); handler = null; }
    var opts = { shapeOptions: shapeStyle, showArea: false };
    if (kind === "polygon") opts.allowIntersection = false;
    handler = kind === "rectangle" ? new L.Draw.Rectangle(map, opts) : new L.Draw.Polygon(map, opts);
    handler.enable();
  }

  map.on("draw:created", function (e) {
    handler = null;
    var layer = e.layer;
    var ring = layer.getLatLngs()[0];
    setArea(layer, function (lat, lon) { return pointInPolygon(lat, lon, ring); });
  });

  function setMode(m) {
    mode = m;
    if (handler) { handler.disable(); handler = null; }
    document.querySelectorAll("[data-mode]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.mode === m));
    });
    $("radius-row").style.display = m === "radius" ? "flex" : "none";
    if (area) { map.removeLayer(area.layer); area = null; clearResults(); pickBtn.disabled = true; }
    if (m !== "radius") startDraw(m);
    promptForMode();
  }

  document.querySelectorAll("[data-mode]").forEach(function (b) {
    b.addEventListener("click", function () { setMode(b.dataset.mode); });
  });
  $("clear").addEventListener("click", function () {
    clearArea();
    if (mode !== "radius") startDraw(mode);
  });

  // ---------- Search & locate ----------
  $("search-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var q = $("q").value.trim();
    if (!q) return;
    setStatus("Searching…");
    fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(q))
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.length) { setStatus("Couldn't find that place. Try a nearby street or city.", true); return; }
        map.flyTo([parseFloat(res[0].lat), parseFloat(res[0].lon)], 15, { animate: !reduceMotion });
        promptForMode();
      })
      .catch(function () { setStatus("Search isn't responding. Pan the map by hand instead.", true); });
  });

  $("locate").addEventListener("click", function () {
    if (!navigator.geolocation) { setStatus("Your browser can't share its location.", true); return; }
    setStatus("Finding you…");
    navigator.geolocation.getCurrentPosition(function (p) {
      map.flyTo([p.coords.latitude, p.coords.longitude], 15, { animate: !reduceMotion });
      promptForMode();
    }, function () {
      setStatus("Location was blocked. Search for an address instead.", true);
    }, { timeout: 10000 });
  });

  // Start near the viewer if they allow it; otherwise the default view stays.
  if (navigator.geolocation && navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: "geolocation" }).then(function (s) {
      if (s.state === "granted") {
        navigator.geolocation.getCurrentPosition(function (p) {
          map.setView([p.coords.latitude, p.coords.longitude], 15);
        });
      }
    }).catch(function () {});
  }

  // ---------- Restaurant data (OpenStreetMap via Overpass) ----------
  function selectedTypes() {
    return ["restaurant", "fast_food", "cafe"].filter(function (t) { return $("t-" + t).checked; });
  }

  function fetchOverpass(query) {
    var i = 0;
    function attempt() {
      if (i >= OVERPASS.length) return Promise.reject(new Error("all mirrors failed"));
      var url = OVERPASS[i++];
      var ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, 30000);
      return fetch(url, {
        method: "POST",
        body: "data=" + encodeURIComponent(query),
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        signal: ctrl.signal
      }).then(function (r) {
        clearTimeout(timer);
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      }).catch(function () { clearTimeout(timer); return attempt(); });
    }
    return attempt();
  }

  function refreshPlaces() {
    if (!area || busy) return;
    var types = selectedTypes();
    if (!types.length) { setStatus("Choose at least one place type below.", true); pickBtn.disabled = true; return; }
    var b = area.layer.getBounds();
    if (spanKm(b) > MAX_SPAN_KM) {
      setStatus("That area is too big (over " + MAX_SPAN_KM + " km across). Shrink it a little.", true);
      pickBtn.disabled = true;
      return;
    }
    var key = b.toBBoxString() + "|" + types.join(",");
    busy = true;
    pickBtn.disabled = true;
    setStatus("Looking up places…");

    var load = cache[key] ? Promise.resolve(cache[key]) : (function () {
      var bbox = [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()].join(",");
      var q = "[out:json][timeout:25];(" + types.map(function (t) {
        return 'nwr["amenity"="' + t + '"]["name"](' + bbox + ");";
      }).join("") + ");out center tags 800;";
      return fetchOverpass(q).then(function (data) {
        var list = data.elements.map(function (el) {
          var lat = el.lat != null ? el.lat : (el.center && el.center.lat);
          var lon = el.lon != null ? el.lon : (el.center && el.center.lon);
          return { id: el.type + el.id, lat: lat, lon: lon, tags: el.tags || {} };
        }).filter(function (p) { return p.lat != null && p.lon != null; });
        cache[key] = list;
        return list;
      });
    })();

    load.then(function (list) {
      busy = false;
      if (!area) return;
      places = list.filter(function (p) { return area.test(p.lat, p.lon); });
      dotsLayer.clearLayers();
      places.forEach(function (p) {
        L.circleMarker([p.lat, p.lon], {
          radius: 5, weight: 1.5, color: "#ffffff", fillColor: getComputedStyle(document.documentElement).getPropertyValue("--dot").trim() || "#2f6f73", fillOpacity: 0.95
        }).bindTooltip(p.tags.name).addTo(dotsLayer);
      });
      if (!places.length) {
        setStatus("Nothing found in that area. Try a bigger one or add more place types.", true);
        pickBtn.disabled = true;
      } else {
        setStatus(places.length + " place" + (places.length === 1 ? "" : "s") + " in your area.");
        pickBtn.disabled = false;
      }
    }).catch(function () {
      busy = false;
      setStatus("Couldn't load restaurants right now. Wait a moment and try the area again.", true);
    });
  }

  ["restaurant", "fast_food", "cafe"].forEach(function (t) {
    $("t-" + t).addEventListener("change", function () { if (area) { clearResults(); refreshPlaces(); } });
  });

  // ---------- Picking ----------
  function rand(n) {
    if (window.crypto && crypto.getRandomValues) {
      var a = new Uint32Array(1);
      crypto.getRandomValues(a);
      return a[0] % n;
    }
    return Math.floor(Math.random() * n);
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function pretty(s) {
    return String(s).split(";").map(function (x) {
      x = x.replace(/_/g, " ").trim();
      return x.charAt(0).toUpperCase() + x.slice(1);
    }).join(", ");
  }

  function addressOf(t) {
    var street = [t["addr:housenumber"], t["addr:street"]].filter(Boolean).join(" ");
    return [street, t["addr:city"]].filter(Boolean).join(", ");
  }

  function show(p) {
    var t = p.tags;
    var kind = t.cuisine ? pretty(t.cuisine) : pretty(t.amenity || "restaurant");
    $("r-cuisine").textContent = kind;
    $("r-name").textContent = t.name;
    $("r-addr").textContent = addressOf(t);
    $("r-addr").hidden = !addressOf(t);
    $("r-hours").textContent = t.opening_hours ? "Hours: " + t.opening_hours : "";
    $("r-hours").hidden = !t.opening_hours;
    var links = $("r-links");
    links.textContent = "";
    var dir = document.createElement("a");
    dir.href = "https://www.google.com/maps/dir/?api=1&destination=" + p.lat + "," + p.lon;
    dir.target = "_blank"; dir.rel = "noopener noreferrer";
    dir.textContent = "Directions";
    links.appendChild(dir);
    var site = t.website || t["contact:website"];
    if (site && /^https?:\/\//i.test(site)) {
      var w = document.createElement("a");
      w.href = site; w.target = "_blank"; w.rel = "noopener noreferrer";
      w.textContent = "Website";
      links.appendChild(w);
    }
  }

  pickBtn.addEventListener("click", function () {
    if (!places.length || busy) return;
    var pool = places.filter(function (p) { return !seen[p.id]; });
    if (!pool.length) { seen = {}; pool = places.slice(); }
    var chosen = pool[rand(pool.length)];
    seen[chosen.id] = true;

    var box = $("result");
    box.hidden = false;
    pickBtn.disabled = true;
    pickLayer.clearLayers();

    var run = Promise.resolve();
    if (!reduceMotion && places.length > 1) {
      box.classList.add("spinning");
      run = (async function () {
        for (var i = 0; i < 14; i++) {
          var p = places[rand(places.length)];
          $("r-name").textContent = p.tags.name;
          $("r-cuisine").textContent = "…";
          $("r-addr").hidden = true; $("r-hours").hidden = true;
          $("r-links").textContent = "";
          await sleep(55 + i * 14);
        }
      })();
    }

    run.then(function () {
      box.classList.remove("spinning");
      show(chosen);
      L.circleMarker([chosen.lat, chosen.lon], {
        radius: 11, weight: 3, color: "#17262b", fillColor: "#e4452f", fillOpacity: 1
      }).bindTooltip(chosen.tags.name, { permanent: true, direction: "top", offset: [0, -10] }).addTo(pickLayer);
      map.panTo([chosen.lat, chosen.lon], { animate: !reduceMotion });
      var remaining = places.filter(function (p) { return !seen[p.id]; }).length;
      leftEl.textContent = remaining
        ? remaining + " more before any repeats. Not feeling it? Pick again."
        : "That was the last unpicked one. The next pick starts over.";
      pickBtn.textContent = "Pick again";
      pickBtn.disabled = false;
      box.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" });
    });
  });

  setMode("radius");
})();
</script>
</body>
</html>
